<html>
<head>
<title>Mini Project: Accessible Student Admission Page</title>
<style>
    body {
      margin: 0;
      background-color: #222;
      font-family: serif;
    }

    .page {
      max-width: 500px;
      margin: 20px auto;
      background-color: white;
    }

    header,
    footer {
      background-color: #1a237e;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    footer {
      padding: 10px;
      font-size: 12px;
    }

    main {
      padding: 20px 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #999;
      padding: 4px 6px;
      text-align: left;
    }

    th {
      background-color: #e3e8f7;
      text-align: center;
    }

    fieldset {
      padding: 10px 15px 15px;
    }

    label {
      font-size: 13px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      max-width: 200px;
      margin-bottom: 15px;
    }

    select {
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="page">

    <header>
      <h1>ABC College Admission 2026</h1>
    </header>

    <main>

      <h2>Courses and Fees</h2>

      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Seats</th>
            <th scope="col">Fees</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
          </tr>
        </tbody>
      </table>

      <form>
        <fieldset>
          <legend>Application Form</legend>

          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" required><br>

          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" required><br>

          <label for="course">Course:</label><br>
          <select id="course" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select><br>

          <label for="statement">Statement:</label><br>
          <textarea id="statement" name="statement" rows="4"></textarea><br>

          <button type="submit">Apply</button>
        </fieldset>
      </form>

    </main>

    <footer>
      <p>&copy; 2026 ABES College</p>
    </footer>

  </div>

</body>
</html>
