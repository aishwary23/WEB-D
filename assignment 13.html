<html>
<head>
<title>Rowspan and Colspan (Timetable)</title>
</head>
<body>
<table border="1" cellpadding="8" cellspacing="0">
<caption><b>Weekly Timetable</b></caption>

 <thead>
   <tr>
   <th scope="col">Day</th>
   <th scope="col">9-10</th>
   <th scope="col">10-11</th>
   <th scope="col">11-12</th>
   </tr>
   </thead>

    <tbody>
      <tr>
        <td>Mon</td>
        <td>Maths</td>
        <td>HTML</td>
        <td rowspan="2">Web Lab</td>
      </tr>

      <tr>
        <td>Tue</td>
        <td>DBMS</td>
        <td>OS</td>
      </tr>

      <tr>
        <td>Wed</td>
        <td colspan="3">Seminar</td>
      </tr>
    </tbody>

  </table>

</body>
</html>
