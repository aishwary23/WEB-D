<html>
<head>
<title>Form Attributes and Input Validation</title>
</head>
<body>

  <form action="submit.php" method="POST">

    <p>
      <label for="fullname" hidden>Full name</label>
      <input type="text" id="fullname" name="fullname"
             placeholder="Full name" required>
    </p>

    <p>
      <label for="email" hidden>Email</label>
      <input type="email" id="email" name="email"
             placeholder="you@college.edu" required>
    </p>

    <p>
      <label for="mobile" hidden>Mobile number</label>
      <input type="text" id="mobile" name="mobile"
             placeholder="10-digit mobile"
             pattern="[0-9]{10}"
             title="Enter exactly 10 digits"
             required>
    </p>

    <p>
      <label for="password" hidden>Password</label>
      <input type="password" id="password" name="password"
             placeholder="Min 6 characters"
             minlength="6" required>
    </p>

    <p>
      <label for="age" hidden>Age</label>
      <input type="number" id="age" name="age"
             placeholder="Age (17-30)"
             min="17" max="30" required>
    </p>

    <p>
      <button type="submit">Register</button>
    </p>

  </form>

</body>
</html>
